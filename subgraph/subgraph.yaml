specVersion: 0.0.9
description: Provenance registry for on-chain ecological datasets — sources, transformations, and attestations.
repository: https://github.com/REPLACE_ME/eco-provenance-registry
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: EcoProvenanceRegistry
    network: base # change to base-sepolia, mainnet, etc. to match deployment
    source:
      address: "0x00000000000000000000000000000000000000" # set after deployment
      abi: EcoProvenanceRegistry
      startBlock: 0 # set to the deployment block
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Dataset
        - ProvenanceRecord
        - ProvenanceEvent
      abis:
        - name: EcoProvenanceRegistry
          file: ../contracts/EcoProvenanceRegistry.json
      eventHandlers:
        - event: DatasetRegistered(uint64,address,string,string,uint64)
          handler: handleDatasetRegistered
        - event: RecordAdded(uint64,uint64,uint8,address,bytes32,string,string,uint64[],uint64,uint64)
          handler: handleRecordAdded
        - event: AttestationRevoked(uint64,address,string,uint64)
          handler: handleAttestationRevoked
      file: ./src/mapping.ts
